<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title> Gé Tavares AWS</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="header-controls">
    <button class="theme-toggle" id="themeToggle" title="Alternar Modo Escuro/Claro">🌙</button>
</div>

<div class="container">
    <img src="logo.png" alt="Logo Ge Tavares AWS" class="logo-gtavares">
    <img src="aws-logo.png" alt="Logo AWS" class="logo-aws">

    <div class="search-wrapper">
        <input type="text" id="busca" placeholder="Busque por serviços AWS que levam para páginas oficiais da AWS..." autofocus>
        <button class="clear-btn" id="clearBtn" title="Limpar busca">✖</button>
    </div>

    <div id="servicos-lista">
        <!-- Os serviços serão inseridos aqui pelo JavaScript -->
    </div>
</div>

<button class="back-to-top" id="backToTop" title="Voltar ao topo">↑</button>

<footer>
  Criado por <a href="https://github.com/rogtavares" target="_blank" rel="noopener">Rogério Tavares, engenheiro de software no Itaú</a> • 2026
  <span class="versao">Versão: 37 (Revisão Maio/26)</span>
</footer>

<script src="app.js"></script>
</body>
</html>
